{% extends 'base.html' %}

{% block content %}
<div class="form-card">
  <h2> Detalles de la acción</h2>
  
  <div style="margin-bottom: 20px;">
    <h3>{{ accion.titulo }}</h3>
    <p><strong>Categoría:</strong> {{ accion.categoria }}</p>
    <p><strong>Descripción:</strong> {{ accion.descripcion }}</p>
    <p><strong>Propuesto por:</strong> {{ accion.propuesto_por }}</p>
  </div>

  <div style="display: flex; gap: 10px;">
    <a href="{{ url_for('main.editar_accion', id=accion.id) }}" class="btn btn-primary">Editar</a>
    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Volver al listado</a>
  </div>
</div>
{% endblock %}
